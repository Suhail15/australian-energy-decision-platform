version: 2
models:
  - name: dim_region
    description: One row per NEM region included in this project.
    columns:
      - name: region_id
        data_tests: [not_null, unique]
  - name: fct_market_price
    description: AEMO firm, valid five-minute wholesale spot price by region and interval.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_id
      - name: interval_start_utc
        data_tests: [not_null]
      - name: price_aud_per_mwh
        data_tests: [not_null]
  - name: fct_operational_demand
    description: AEMO half-hour actual operational demand by region and interval.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_id
      - name: interval_start_utc
        data_tests: [not_null]
      - name: operational_demand_mw
        data_tests: [not_null]
  - name: daily_price_metrics
    description: Daily summary of valid five-minute price intervals.
    columns:
      - name: local_date
        data_tests: [not_null]
      - name: observed_intervals
        data_tests: [not_null]
