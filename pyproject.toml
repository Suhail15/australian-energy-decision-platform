[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "australian-energy-decision-platform"
version = "0.1.0"
description = "A reproducible Queensland electricity-price case study with a hypothetical two-hour load shift"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=17,<25",
  "duckdb>=1.2,<2",
  "dbt-duckdb>=1.9,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "streamlit>=1.42,<2",
  "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
visuals = ["matplotlib>=3.10,<4"]

[project.scripts]
energy-platform = "energy_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
