services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8502:8501"
    volumes:
      - ./data:/app/data:ro
  api:
    build: .
    command: ["uvicorn", "energy_platform.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/app/data:ro
